name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository.
permissions:
  contents: read

env:
  # The example app takes its (non-secret) config from --dart-define; nothing
  # in CI ever needs an API key, and none is available here by design.
  UQPAY_ENVIRONMENT: sandbox

# Every third-party action is pinned to a full commit SHA (the `# vX.Y.Z`
# comment names the release). Dependabot (.github/dependabot.yml) proposes
# bumps; a moved tag can never change what runs here.

jobs:
  # ---------------------------------------------------------------------------
  # Static checks and unit tests — on the oldest supported Flutter (the floor
  # in pubspec.yaml) and on the newest stable. Both, every PR.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (flutter ${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.41.0 is exactly the floor declared in pubspec.yaml
        # (flutter: ">=3.41.0", "stable N-2"); it ships Dart 3.11.0.
        flutter-version: [stable, 3.41.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version == 'stable' && '' || matrix.flutter-version }}
          cache: true

      - run: flutter --version

      # All three pub roots must be resolved before `flutter analyze`, which
      # walks the whole tree (example/ and example/backend/ included). A fresh
      # clone has no .dart_tool/ anywhere.
      - name: Pub get (package)
        run: flutter pub get

      - name: Pub get (example)
        run: flutter pub get
        working-directory: example

      - name: Pub get (reference backend)
        run: dart pub get
        working-directory: example/backend

      # Formatter output differs between Dart versions (e.g. Dart 3.13 folds a
      # dangling `)\n  ;` after an enum's last value into `);`, Dart 3.11 puts
      # it back), so both legs can never agree. Format is checked on the
      # pinned floor leg only; a new stable formatter can't break PRs
      # overnight. Analyze and test still run on both legs.
      # Explicit paths, never `.`: build output and other pub roots are not
      # ours to reformat.
      - name: Format (floor leg only)
        if: matrix.flutter-version != 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/backend

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Every test file except the pixel-golden ones: goldens are
      # rendered on macOS and only compared on the macOS job below, where
      # the full suite also runs with coverage.
      - name: Test (non-golden)
        shell: bash
        run: |
          set -euo pipefail
          # Test paths never contain spaces; word splitting is intended.
          files="$(.github/scripts/test_files.sh non-golden)"
          echo "Running $(wc -l <<<"$files") non-golden test files"
          # shellcheck disable=SC2086
          flutter test $files

      # The README quickstart is real compiled code and ERROR_CODES.md is
      # generated from the mapper. Both tests fail on drift; they run inside
      # the step above, but are named here so a failure is unmistakable in
      # the CI log. Same for the signature-level public-API snapshot
      # and the source tripwires (Enum.name / runtimeType, clock seam).
      - name: Docs cannot drift
        run: flutter test test/docs

      - name: Public API snapshot and source hygiene
        run: flutter test test/public_api_snapshot_test.dart test/source_hygiene_test.dart

      - name: Test (example)
        run: flutter test
        working-directory: example

      - name: Test (reference backend)
        run: dart test
        working-directory: example/backend

  # ---------------------------------------------------------------------------
  # The FULL test suite, goldens included, with coverage.
  #
  # The golden PNGs under test/goldens/ are generated on macOS; Linux
  # rasterises glyphs and anti-aliases edges differently, so a pixel compare
  # is only meaningful on a macOS runner. Rather than loosen the comparator,
  # goldens run here and the ubuntu job above runs everything else
  # (.github/scripts/test_files.sh does the split by content). Goldens are
  # regenerated only by an explicit, reviewed command:
  #   flutter test --update-goldens <file>
  # ---------------------------------------------------------------------------
  test-macos:
    name: test + goldens (macos, flutter ${{ matrix.flutter-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: [stable, 3.41.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version == 'stable' && '' || matrix.flutter-version }}
          cache: true

      - run: flutter --version

      - name: Pub get (package)
        run: flutter pub get

      - name: Test (full suite, goldens included)
        run: flutter test --coverage

      - name: Goldens (named, so a pixel failure is unmistakable)
        shell: bash
        run: |
          set -euo pipefail
          # macOS ships bash 3.2 (no mapfile); paths never contain spaces.
          files="$(.github/scripts/test_files.sh golden)"
          [[ -n "$files" ]] || { echo "::error::no golden tests found"; exit 1; }
          echo "Golden test files:"; echo "$files"
          # shellcheck disable=SC2086
          flutter test $files

      # >=85% overall, and 100% on the files where a wrong answer means a
      # wrong amount, a wrong error, or a double charge.
      - name: Coverage thresholds
        run: dart run tool/check_coverage.dart

      # A failed golden writes the expected/actual/diff PNGs next to the
      # test; keep them so the PR reviewer can see what moved.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-failures-${{ matrix.flutter-version }}
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # pub.dev scoring — must be a perfect score with zero warnings. pub.dev
  # scores with the newest stable, so this job does too.
  # ---------------------------------------------------------------------------
  pana:
    name: pana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: dart pub get
        working-directory: example/backend
      - run: dart pub global activate pana
      - name: pana (report archived as a release artifact)
        # `shell: bash` turns on pipefail, so a pana regression fails the
        # step even though its output is piped into tee.
        shell: bash
        run: |
          dart pub global run pana --no-warning --exit-code-threshold 0 --json . \
            | tee pana-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pana-report
          path: pana-report.json

  # ---------------------------------------------------------------------------
  # The example app must build on every declared platform, at the floor and
  # at the newest stable. Web is built twice: JS and Wasm.
  # ---------------------------------------------------------------------------
  build-android-web:
    name: build android+web (flutter ${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: [stable, 3.41.0]
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version == 'stable' && '' || matrix.flutter-version }}
          cache: true
      - run: flutter pub get
      - name: Build Android (debug)
        run: flutter build apk --debug --dart-define=UQPAY_ENVIRONMENT=$UQPAY_ENVIRONMENT
      # The SDK must survive Dart obfuscation and R8 (release builds
      # minify by default). The example needs no define file: it falls back
      # to sandbox + http://localhost:8787 when app.env is absent, and
      # app.env is gitignored by design.
      - name: Build Android (release, obfuscated + R8)
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --obfuscate --split-debug-info=build/symbols \
            --dart-define=UQPAY_ENVIRONMENT=$UQPAY_ENVIRONMENT
          # --split-debug-info only writes symbol files when obfuscation
          # actually ran.
          ls build/symbols/*.symbols
      # Kept for the manual obfuscated smoke payment. Signed with
      # the debug key (demo only); never a release artifact.
      - name: Upload obfuscated APK
        if: matrix.flutter-version == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-release-obfuscated-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
      - name: Build web (JS)
        run: flutter build web --dart-define=UQPAY_ENVIRONMENT=$UQPAY_ENVIRONMENT
      - name: Build web (Wasm)
        run: flutter build web --wasm --dart-define=UQPAY_ENVIRONMENT=$UQPAY_ENVIRONMENT

  build-ios:
    name: build ios (flutter ${{ matrix.flutter-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: [stable, 3.41.0]
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version == 'stable' && '' || matrix.flutter-version }}
          cache: true
      - run: flutter pub get
      # The 3.41.0 leg is the exact minimum supported iOS toolchain build.
      - name: Build iOS (debug, no codesign)
        run: flutter build ios --no-codesign --debug --dart-define=UQPAY_ENVIRONMENT=$UQPAY_ENVIRONMENT
      - name: Build iOS (release, no codesign, obfuscated)
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols \
            --dart-define=UQPAY_ENVIRONMENT=$UQPAY_ENVIRONMENT
          ls build/symbols/*.symbols

  # ---------------------------------------------------------------------------
  # A merchant must be able to resolve the SDK next to a typical app
  # dependency set (Firebase, Dio, GoRouter, Riverpod, plus
  # flutter_localizations, whose exact `intl` pin is the classic conflict).
  # A throwaway app is generated in the job and must `pub get` cleanly on the
  # floor and on the newest stable.
  # ---------------------------------------------------------------------------
  dependency-fixture:
    name: dependency fixture (flutter ${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: [stable, 3.41.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version == 'stable' && '' || matrix.flutter-version }}
          cache: true
      - name: Create fixture app
        run: flutter create --no-pub --org com.example --project-name dep_fixture --platforms android,ios,web fixture
      - name: Add the SDK and a typical dependency set
        working-directory: fixture
        run: |
          flutter pub add \
            'uqpay_sdk_flutter:{"path":"../sdk"}' \
            firebase_core dio go_router flutter_riverpod intl \
            'flutter_localizations:{"sdk":"flutter"}'
      - name: Resolve (must succeed)
        working-directory: fixture
        run: flutter pub get
      # Informational: which of the merchant's packages are held below their
      # newest release in this fixture (usually by the Flutter SDK's own
      # pins, not by us). A conflict caused by this SDK fails the step above.
      - name: Report held-back packages
        working-directory: fixture
        run: flutter pub outdated --no-dev-dependencies

  # ---------------------------------------------------------------------------
  # Any change under lib/ must land with a CHANGELOG.md entry in the same PR.
  # ---------------------------------------------------------------------------
  changelog:
    name: changelog updated with lib/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The SHAs come in through env, never interpolated into the script.
      - name: Check CHANGELOG.md changed when lib/ changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Git's well-known empty tree (4b825dc642cb6eb9a060e54bf8d69288fbee4904),
          # computed rather than typed: diffing against it lists every file,
          # which is what "changed" means on a repository's first commit.
          empty_tree="$(git hash-object -t tree /dev/null)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            # First push to a branch / forced push: fall back to the parent,
            # or to the empty tree when HEAD has no parent (first commit).
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse -q --verify 'HEAD~1^{commit}' || echo "$empty_tree")"
            fi
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files since $base:"
          echo "$changed"
          if grep -q '^lib/' <<<"$changed" && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "::error file=CHANGELOG.md::lib/ changed but CHANGELOG.md did not. Add an entry in the same PR."
            exit 1
          fi
          echo "OK"
