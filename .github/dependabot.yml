# Weekly dependency update PRs. Every PR runs the full CI matrix (floor and
# newest stable). GitHub Actions are pinned to commit SHAs; Dependabot keeps
# the SHA and its `# vX.Y.Z` comment up to date together.
version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /example
      - /example/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
